short_bio: >-
  <p>
    Hey! My name is Shaojun Xia.
  </p>
  <p>
    My current research interests focus on Image Processing, LLM/VLM, AI Agents, and Representation Learing. I am particularly interested in developing intelligent multimodal systems that integrate language, vision, and autonomous reasoning capabilities. I have also collaborated with researchers and engineers from industry, including Google, Meta, Foxconn, puffo.ai, etc, on research topics related to artificial intelligence. These collaborations have provided me with valuable understanding in connecting academic research with real-world industry trends.
  </p>
  <p>
    In addition, due to the nature of my previous research positions, I have been involved in a range of AI-related interdisciplinary research projects, primarily spanning medical imaging, signal processing, cancer research, and neuroscience.
  </p>
  <p>
    I am open to collaborations of various kinds. For any suggestions, please reach out to me via the email link on the left.
  </p>

