short_bio_text_justify: false
short_bio: >-
  <p>
    Hey! My name is Shaojun Xia.
  </p>
  <p>
    My current research interests focus on Image Processing, LLM/VLM, AI Agents, and Representation Learning. I am particularly interested in developing intelligent multimodal systems that integrate language, vision, and autonomous reasoning capabilities. I have also collaborated with researchers and engineers from industry, including Google, Meta, Foxconn, puffo.ai, etc, on research topics related to artificial intelligence. These collaborations have provided me with valuable understanding in connecting academic research with real-world industry trends.
  </p>
  <p>
    Previously, due to the nature of my research positions, I have been engaged in a range of AI-related interdisciplinary projects, primarily spanning medical imaging, signal processing, cancer, and neuroscience.
  </p>
  <p>
    I am open to collaborations of various kinds. For any suggestions, please reach out to me via the email link on the left.
  </p>

